name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    permissions:
      contents: read
      pull-requests: write
    uses: spacecode-art/atlas-security/.github/workflows/reusable-secrets-scan.yml@v1.0.4
    secrets: inherit

  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check harness regressions (fixtures and command stubs only)
        run: node --test tests/*.test.mjs
      - name: Check shell runners
        run: shellcheck scripts/*.sh
