apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  namespace: tawira
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      # tawira:chaos-local image USER verified: uid=100, gid=101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: loadgen
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Reuses the Tawira image only because it ships Node 22.
          image: tawira:chaos-local
          imagePullPolicy: Never
          command: ["node", "/scripts/loadgen.mjs"]
          envFrom:
            - secretRef:
                name: loadgen-env
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: loadgen-script
